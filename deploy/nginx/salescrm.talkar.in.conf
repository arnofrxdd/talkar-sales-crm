server {
    listen 80;
    server_name salescrm.talkar.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name salescrm.talkar.in;

    ssl_certificate /etc/letsencrypt/live/salescrm.talkar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salescrm.talkar.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7576;
        proxy_http_version 1.1;

        # WebSocket & Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial for Server-Sent Events (SSE) live stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
